env:
  benchmark: libero_spatial
  task_idx: 0
  camera_heights: 128
  camera_widths: 128
  horizon: 500

demo:
  n_clean: 20
  n_contaminated: 60
  # structural defect: early gripper release during lift phase
  defect_type: early_release
  # fraction of lift phase at which to release [0.0 = immediately, 1.0 = never]
  release_fraction: 0.3

train:
  obs_keys:
    - robot0_eef_pos
    - robot0_eef_quat
    - robot0_gripper_qpos
    - akita_black_bowl_1_pos
    - akita_black_bowl_1_to_robot0_eef_pos
    - plate_1_pos
    - plate_1_to_robot0_eef_pos
  action_dim: 7
  hidden_dims: [256, 256]
  lr: 1e-3
  batch_size: 256
  n_epochs: 300
  n_history: 1
  seed: 42

eval:
  n_rollouts: 10
  horizon: 500
